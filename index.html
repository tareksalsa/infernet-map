<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infernet Node Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <!-- Dashboard section -->
  <div id="dashboard">
    <div class="stat">
      <h2 id="nodesCount">0</h2>
      <p>Active Nodes</p>
    </div>
    <div class="stat">
      <h2 id="tasksCount">0</h2>
      <p>Running Tasks</p>
    </div>
    <div class="stat">
      <h2 id="completedCount">0</h2>
      <p>Completed</p>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <script>
    // Create map
    const map = L.map("map", {
      worldCopyJump: false,
      minZoom: 2,
      maxZoom: 5
    }).setView([20, 0], 2);

    // Dark background tiles
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; CARTO",
      subdomains: "abcd"
    }).addTo(map);

    // Load node data
    fetch("nodes.json")
      .then(res => res.json())
      .then(data => {
        let activeNodes = 0, runningTasks = 0, completed = 0;

        data.nodes.forEach(node => {
          const marker = L.circleMarker([node.lat, node.lon], {
            radius: 8,
            color: node.status === "online" ? "#00ff88" : "#ff4444",
            fillOpacity: 0.85,
            weight: 1
          }).addTo(map);

          marker.bindPopup(`
            <b>${node.name}</b><br>
            🌍 ${node.region}<br>
            ⚙️ v${node.version}<br>
            🧠 Tasks: ${node.tasks}<br>
            🔌 Status: <b style="color:${node.status === "online" ? "#00ff88" : "#ff4444"}">${node.status}</b>
          `);

          if (node.status === "online") activeNodes++;
          runningTasks += node.tasks;
          completed += node.completed;
        });

        // Update dashboard numbers
        document.getElementById("nodesCount").textContent = activeNodes;
        document.getElementById("tasksCount").textContent = runningTasks;
        document.getElementById("completedCount").textContent = completed;
      });
  </script>
</body>
</html>
