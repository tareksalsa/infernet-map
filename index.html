<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="map" style="height: 100vh; width: 100vw;"></div>

<script>
  const map = L.map('map', {
    center: [20, 0],
    zoom: 2,
    zoomControl: false,
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 5,
    minZoom: 2,
    noWrap: true,
  }).addTo(map);

  fetch('nodes.json')
    .then((r) => r.json())
    .then((nodes) => {
      nodes.forEach((node) => {
        const marker = L.circleMarker([node.lat, node.lng], {
          radius: 6,
          color: node.active ? 'lime' : 'red',
          fillOpacity: 0.8,
        }).addTo(map);

        marker.bindPopup(`<b>${node.name}</b><br>Status: ${node.active ? 'Active' : 'Offline'}`);
      });
    })
    .catch((e) => console.error('Error loading nodes:', e));
</script>
