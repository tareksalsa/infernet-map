<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infernet Live Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #map {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    .dashboard {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 12px;
      box-shadow: 0 0 8px #0f0;
      font-size: 14px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="dashboard">
    🟢 Online Nodes: <span id="onlineCount">0</span><br>
    ⚙️ Active Tasks: <span id="taskCount">0</span>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let lines = [];

    fetch('nodes.json')
      .then(r => {
        if (!r.ok) throw new Error("nodes.json not found");
        return r.json();
      })
      .then(data => {
        const nodes = data.nodes;

        const online = nodes.filter(n => n.status === 'online');
        document.getElementById('onlineCount').innerText = online.length;
        document.getElementById('taskCount').innerText = online.reduce((a,b)=>a+b.tasks,0);

        nodes.forEach(n => {
          const color = n.status === 'online' ? 'lime' :
                        n.status === 'maintenance' ? 'yellow' : 'red';

          const marker = L.circleMarker([n.lat, n.lon], {
            radius: 8,
            color,
            fillOpacity: 0.9
          }).addTo(map);

          marker.bindTooltip(`
            <b>${n.name}</b><br>
            Status: ${n.status}<br>
            Tasks: ${n.tasks}<br>
            Completed: ${n.completed}
          `);
        });

        function drawConnections() {
          lines.forEach(l => map.removeLayer(l));
          lines = [];

          const shuffled = online.sort(() => 0.5 - Math.random());
          const pairs = shuffled.slice(0, Math.min(4, shuffled.length - 1));

          for (let i = 0; i < pairs.length - 1; i++) {
            const from = pairs[i];
            const to = pairs[i + 1];

            const line = L.polyline([[from.lat, from.lon], [to.lat, to.lon]], {
              color: '#00ffff',
              weight: 2,
              opacity: 0.7,
              dashArray: '6,8'
            }).addTo(map);

            lines.push(line);
            let offset = 0;
            setInterval(() => {
              offset = (offset + 1) % 16;
              if (line._path) line._path.style.strokeDashoffset = offset;
            }, 100);
          }
        }

        drawConnections();
        setInterval(drawConnections, 4000);
      })
      .catch(err => {
        console.error(err);
        alert("⚠️ Error loading nodes.json");
      });
  </script>
</body>
</html>
