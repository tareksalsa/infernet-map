<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infernet Node Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(circle at center, #0a0a0a 20%, #000 100%);
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      filter: brightness(0.85) contrast(1.1);
      pointer-events: none;
    }

    .dashboard {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(20, 20, 20, 0.85);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,255,255,0.2);
      font-size: 14px;
      line-height: 1.6;
      backdrop-filter: blur(4px);
    }

    .dashboard span {
      color: cyan;
      font-weight: bold;
    }

    /* 🔵 خط متحرك (أنيميشن) */
    @keyframes flow {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .flow-line {
      stroke: rgba(0,255,255,0.3);
      stroke-width: 1.5;
      stroke-dasharray: 8;
      animation: flow 4s linear infinite;
    }

    .leaflet-tooltip {
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="dashboard" id="stats">Loading...</div>

  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      zoomControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      worldCopyJump: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      noWrap: true,
      bounds: [[-90, -180], [90, 180]],
      attribution: ''
    }).addTo(map);

    const nodes = [
      { name: "Tokyo 🇯🇵", lat: 35.6895, lon: 139.6917, status: "online", tasks: 12, completed: 48 },
      { name: "Singapore 🇸🇬", lat: 1.3521, lon: 103.8198, status: "online", tasks: 9, completed: 41 },
      { name: "Frankfurt 🇩🇪", lat: 50.1109, lon: 8.6821, status: "online", tasks: 6, completed: 38 },
      { name: "London 🇬🇧", lat: 51.5074, lon: -0.1278, status: "online", tasks: 8, completed: 32 },
      { name: "San Francisco 🇺🇸", lat: 37.7749, lon: -122.4194, status: "maintenance", tasks: 3, completed: 27 },
      { name: "Toronto 🇨🇦", lat: 43.65107, lon: -79.347015, status: "online", tasks: 5, completed: 34 },
      { name: "São Paulo 🇧🇷", lat: -23.5505, lon: -46.6333, status: "offline", tasks: 0, completed: 22 },
      { name: "Sydney 🇦🇺", lat: -33.8688, lon: 151.2093, status: "online", tasks: 7, completed: 30 }
    ];

    const colors = { online: "lime", maintenance: "yellow", offline: "red" };
    let onlineCount = 0, totalTasks = 0, totalCompleted = 0;
    const points = [];

    nodes.forEach(n => {
      if (n.status === "online") onlineCount++;
      totalTasks += n.tasks;
      totalCompleted += n.completed;

      const marker = L.circleMarker([n.lat, n.lon], {
        radius: 8,
        color: colors[n.status],
        fillOpacity: 0.9
      }).addTo(map);

      marker.bindTooltip(
        `<b>${n.name}</b><br>Status: ${n.status}<br>
