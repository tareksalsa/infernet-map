<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infernet Network Map</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 40%, #02131e 0%, #000 80%);
    }
    #dashboard {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0,255,255,0.15);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }
    #dashboard span {
      display: inline-block;
      min-width: 45px;
      text-align: right;
      color: #7CFFB2;
      font-weight: 600;
    }
    #tooltip {
      position: absolute;
      background: rgba(10,10,10,0.85);
      color: #fff;
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      pointer-events: none;
      transform: translate(-50%, -120%);
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    #tooltip.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="dashboard">
    Nodes: <span id="dash-nodes">0</span><br>
    Online: <span id="dash-online">0</span><br>
    Tasks: <span id="dash-tasks">0</span>
  </div>

  <div id="tooltip" class="hidden"></div>

  <script src="nodes.js"></script>
</body>
</html>
