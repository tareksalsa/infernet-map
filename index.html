<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infernet Node Map</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at center, #020202 0%, #000010 100%);
    font-family: "Inter", sans-serif;
    overflow: hidden;
  }

  .map-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: url("https://upload.wikimedia.org/wikipedia/commons/8/83/Earthlights_2012_Asia.png") center/cover no-repeat;
    filter: brightness(0.4) contrast(1.3);
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .dashboard {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(20,20,20,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    box-shadow: 0 0 10px rgba(0,255,255,0.3);
    backdrop-filter: blur(5px);
  }

  .dashboard span {
    color: cyan;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="map-container">
    <canvas id="mapCanvas"></canvas>
    <div class="dashboard" id="stats">Loading...</div>
  </div>

<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const nodes = [
  { name: "Tokyo 🇯🇵", x: 880, y: 320, status: "online", tasks: 12, completed: 48 },
  { name: "Singapore 🇸🇬", x: 840, y: 420, status: "online", tasks: 9, completed: 41 },
  { name: "Frankfurt 🇩🇪", x: 530, y: 260, status: "online", tasks: 6, completed: 38 },
  { name: "London 🇬🇧", x: 500, y: 240, status: "online", tasks: 8, completed: 32 },
  { name: "San Francisco 🇺🇸", x: 120, y: 280, status: "maintenance", tasks: 3, completed: 27 },
  { name: "Toronto 🇨🇦", x: 160, y: 260, status: "online", tasks: 5, completed: 34 },
  { name: "São Paulo 🇧🇷", x: 220, y: 480, status: "offline", tasks: 0, completed: 22 },
  { name: "Sydney 🇦🇺", x: 900, y: 560, status: "online", tasks: 7, completed: 30 }
];

const colors = { online: "cyan", maintenance: "yellow", offline: "red" };
let onlineCount = 0, totalTasks = 0, totalCompleted = 0;

nodes.forEach(n => {
  if (n.status === "online") onlineCount++;
  totalTasks += n.tasks;
  totalCompleted += n.completed;
});

document.getElementById("stats").innerHTML = `
  🌐 <b>Nodes:</b> <span>${nodes.length}</span><br>
  🟢 <b>Online:</b> <span>${onlineCount}</span><br>
  ⚙️ <b>Tasks:</b> <span>${totalTasks}</span><br>
  ✅ <b>Completed:</b> <span>${totalCompleted}</span>
`;

function drawNetwork(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // خطوط متوهجة متحركة
  nodes.forEach((a, i) => {
    nodes.slice(i + 1).forEach(b => {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 500) {
        const alpha = 0.25 + 0.25 * Math.sin(t / 400 + dist);
        ctx.strokeStyle = `rgba(0,255,255,${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    });
  });

  // رسم النودز
  nodes.forEach(n => {
    ctx.beginPath();
    ctx.arc(n.x, n.y, 5 + 2*Math.sin(t/400), 0, Math.PI * 2);
    ctx.fillStyle = colors[n.status];
    ctx.shadowColor = colors[n.status];
    ctx.shadowBlur = 10;
    ctx.fill();
  });

  requestAnimationFrame(drawNetwork);
}

drawNetwork(0);
</script>
</body>
</html>
