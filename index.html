<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infernet Node Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    #map { width: 100%; height: 100%; }
    .leaflet-tooltip { background: rgba(0,0,0,0.7); color: #fff; border: none; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      zoomControl: false,
      dragging: true,
      scrollWheelZoom: false
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: ''
    }).addTo(map);

    // Data embedded directly (no fetch)
    const nodes = [
      { name: "Tokyo 🇯🇵", lat: 35.6895, lon: 139.6917, status: "online", tasks: 12, completed: 48 },
      { name: "Singapore 🇸🇬", lat: 1.3521, lon: 103.8198, status: "online", tasks: 9, completed: 41 },
      { name: "Frankfurt 🇩🇪", lat: 50.1109, lon: 8.6821, status: "online", tasks: 6, completed: 38 },
      { name: "London 🇬🇧", lat: 51.5074, lon: -0.1278, status: "online", tasks: 8, completed: 32 },
      { name: "San Francisco 🇺🇸", lat: 37.7749, lon: -122.4194, status: "maintenance", tasks: 3, completed: 27 },
      { name: "Toronto 🇨🇦", lat: 43.65107, lon: -79.347015, status: "online", tasks: 5, completed: 34 },
      { name: "São Paulo 🇧🇷", lat: -23.5505, lon: -46.6333, status: "offline", tasks: 0, completed: 22 },
      { name: "Sydney 🇦🇺", lat: -33.8688, lon: 151.2093, status: "online", tasks: 7, completed: 30 }
    ];

    const colors = {
      online: "lime",
      maintenance: "yellow",
      offline: "red"
    };

    const markers = [];

    nodes.forEach(n => {
      const marker = L.circleMarker([n.lat, n.lon], {
        radius: 8,
        color: colors[n.status],
        fillOpacity: 0.9
      }).addTo(map);

      marker.bindTooltip(
        `<b>${n.name}</b><br>
        Status: ${n.status}<br>
        Tasks: ${n.tasks}<br>
        Completed: ${n.completed}`
      );

      markers.push(marker.getLatLng());
    });

    // Draw connection lines between major regions
    for (let i = 0; i < markers.length - 1; i++) {
      L.polyline([markers[i], markers[i + 1]], {
        color: 'cyan',
        weight: 1.5,
        opacity: 0.6
      }).addTo(map);
    }
  </script>
</body>
</html>
